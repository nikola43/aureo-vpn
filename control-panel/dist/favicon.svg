<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24"/>
      <stop offset="50%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="#111827"/>

  <!-- Shield shape -->
  <path
    d="M256 80 L400 140 L400 280 C400 360 340 420 256 460 C172 420 112 360 112 280 L112 140 L256 80Z"
    fill="url(#goldGradient)"
    filter="url(#glow)"
  />

  <!-- Inner shield -->
  <path
    d="M256 120 L360 165 L360 275 C360 335 315 380 256 410 C197 380 152 335 152 275 L152 165 L256 120Z"
    fill="#111827"
  />

  <!-- Center lock icon -->
  <rect x="216" y="240" width="80" height="70" rx="10" fill="url(#goldGradient)"/>
  <path d="M236 240 L236 210 C236 190 246 180 256 180 C266 180 276 190 276 210 L276 240"
        stroke="url(#goldGradient)"
        stroke-width="16"
        fill="none"
        stroke-linecap="round"/>

  <!-- Keyhole -->
  <circle cx="256" cy="275" r="12" fill="#111827"/>
  <rect x="250" y="275" width="12" height="20" fill="#111827"/>
</svg>
