# Prometheus configuration for Aureo VPN

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'aureo-node'
    static_configs:
      - targets: ['aureo-node:8080']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
