# Aureo VPN - Decentralized Node (Full Stack)
#
# Includes: VPN Node + Dashboard + Prometheus + Grafana + Nginx
#
# Usage:
#   docker compose up -d
#

services:
  # ===========================================
  # AUREO VPN NODE (API + VPN + P2P)
  # ===========================================
  aureo-node:
    build:
      context: ../..
      dockerfile: deployments/decentralized/Dockerfile
    container_name: aureo-node
    restart: unless-stopped
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    ports:
      - "8080:8080"           # API
      - "4001:4001/tcp"       # P2P TCP
      - "4001:4001/udp"       # P2P QUIC
      - "51820:51820/udp"     # WireGuard
    volumes:
      - aureo-data:/data
      - /lib/modules:/lib/modules:ro
    environment:
      - NODE_NAME=${NODE_NAME:-}
      - PUBLIC_IP=${PUBLIC_IP:-}
      - API_PORT=8080
      - P2P_PORT=4001
      - WG_PORT=51820
      - COUNTRY=${COUNTRY:-}
      - COUNTRY_CODE=${COUNTRY_CODE:-}
      - CITY=${CITY:-}
      - LATITUDE=${LATITUDE:-}
      - LONGITUDE=${LONGITUDE:-}
      - BOOTSTRAP_PEERS=${BOOTSTRAP_PEERS:-}
      - ENABLE_API=true
      - ENABLE_VPN=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - aureo-network

  # ===========================================
  # OPERATOR DASHBOARD (Node.js + Nginx)
  # ===========================================
  dashboard:
    build:
      context: ../..
      dockerfile: deployments/decentralized/Dockerfile.dashboard
      args:
        VITE_API_URL: /api/v1
    container_name: aureo-dashboard
    restart: unless-stopped
    ports:
      - "5000:80"
    depends_on:
      - aureo-node
    networks:
      - aureo-network

  # ===========================================
  # PROMETHEUS (Metrics Collection)
  # ===========================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: aureo-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      - aureo-node
    networks:
      - aureo-network

  # ===========================================
  # GRAFANA (Monitoring Dashboard)
  # ===========================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: aureo-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - aureo-network

  # ===========================================
  # NGINX (Reverse Proxy)
  # ===========================================
  nginx:
    image: nginx:alpine
    container_name: aureo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - aureo-node
      - dashboard
      - grafana
      - prometheus
    networks:
      - aureo-network

networks:
  aureo-network:
    driver: bridge

volumes:
  aureo-data:
  prometheus-data:
  grafana-data:
